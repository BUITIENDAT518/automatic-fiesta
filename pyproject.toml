[project]
name = "orderhub"
version = "0.1.0"
description = "Distributed multi-marketplace order ingestion (Shopee, TikTok Shop, Lazada)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "redis>=5.0,<9",
  "asyncpg>=0.29,<1",
  "cryptography>=42",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orderhub*"]

[tool.setuptools.package-data]
"orderhub.api" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
